name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Install patchelf
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 使用仓库根目录里固定的 release.keystore：每次构建签名一致，才能直接覆盖安装升级（不用卸载、不丢数据）
      - name: Check signing keystore
        run: test -f release.keystore || (echo "仓库根目录缺少 release.keystore，请先上传" && exit 1)

      # ── CrispASR 原生库（Breeze 本地 TTS 用）──
      # 只在缓存不存在时编译（约十分钟）；想升级 CrispASR 或重编，把下面 key 末尾的 v5 改成 v6
      - name: Cache CrispASR native libs
        id: crispasr-cache
        uses: actions/cache@v4
        with:
          path: crispasr-so
          key: crispasr-so-arm64-v5

      - name: Build CrispASR native libs (arm64-v8a)
        if: steps.crispasr-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          export ANDROID_NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          export ANDROID_NDK_HOME="$ANDROID_NDK"
          echo "NDK = $ANDROID_NDK"
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/CrispStrobe/CrispASR.git "$RUNNER_TEMP/crispasr"
          cd "$RUNNER_TEMP/crispasr"
          chmod +x build-android.sh

          # ── 打开手机 CPU 的加速指令：dotprod（点积）+ fp16（半精度）+ i8mm（int8 矩阵乘）──
          # 之前的编译日志里 HAVE_DOTPROD / HAVE_MATMUL_INT8 / HAVE_FP16_VECTOR_ARITHMETIC 全是 Failed，
          # 说明 ggml 只用了最基础的 NEON，Q8_0/Q4_K 的矩阵乘法会慢很多。
          # 上一版用环境变量 CFLAGS 传参，实测没生效（脚本自己传了 cmake 参数，把它盖掉了）。
          # 这一版直接改顶层 CMakeLists.txt：不管脚本怎么调用 cmake，参数都会生效。
          # 目标手机是天玑 9300+（4×Cortex-X4 + 4×Cortex-A720，ARMv9.2，支持 i8mm）。
          # 注意：编出来的库在不支持 i8mm 的旧手机上会闪退（非法指令），换手机/给别人用前要改回低档。
          python3 - <<'PY'
          import re
          p = "CMakeLists.txt"
          s = open(p, encoding="utf-8").read()
          arch = "armv8.6-a+dotprod+fp16+i8mm"
          inject = (
              "\n# --- injected by CI: enable dotprod/i8mm on arm64 ---\n"
              'if(CMAKE_SYSTEM_PROCESSOR MATCHES "aarch64|arm64" OR ANDROID_ABI STREQUAL "arm64-v8a")\n'
              f'  set(GGML_CPU_ARM_ARCH "{arch}" CACHE STRING "" FORCE)\n'
              '  set(CMAKE_C_FLAGS "$' + '{CMAKE_C_FLAGS} -march=' + arch + '")\n'
              '  set(CMAKE_CXX_FLAGS "$' + '{CMAKE_CXX_FLAGS} -march=' + arch + '")\n'
              "endif()\n"
          )
          m = re.search(r"^\s*cmake_minimum_required\s*\(.*?\)\s*$", s, re.M)
          pos = m.end() if m else 0
          open(p, "w", encoding="utf-8").write(s[:pos] + inject + s[pos:])
          print("已把 ARM 加速参数写入 CMakeLists.txt，位置:", pos)
          PY

          # build-android.sh 支持 --abi 参数时只编 arm64（更快，也不会再有 32 位失败）；
          # 不支持就退回默认参数（会多编一遍 32 位，失败可忽略）。bash -x 会把脚本里实际执行的 cmake 命令全部打印出来，方便排查。
          OUT_DIR="build-android/arm64-v8a"
          bash -x ./build-android.sh --abi arm64-v8a || echo "::warning::带 --abi 参数的编译以非 0 退出"
          if [ ! -f "$OUT_DIR/src/libcrispasr.so" ]; then
            echo "::warning::带 --abi 参数没有编出 arm64 产物，退回默认参数重编"
            bash -x ./build-android.sh || echo "::warning::build-android.sh 以非 0 退出（32 位失败可忽略），继续检查 arm64 产物"
          fi
          test -f "$OUT_DIR/src/libcrispasr.so" || { echo "::error::arm64 的 libcrispasr.so 没编出来"; exit 1; }

          # 打印 ggml-cpu 实际使用的编译参数，里面应该有 -march=armv8.6-a+dotprod+fp16+i8mm
          echo "=== ggml-cpu 实际使用的编译参数 ==="
          find "$OUT_DIR" -path "*ggml-cpu*" -name flags.make -exec grep -h "C_FLAGS\|CXX_FLAGS" {} \; | cut -c1-400 | sort -u | head -10

          mkdir -p "$GITHUB_WORKSPACE/crispasr-so"
          # 只拿 arm64 的 so；libwhisper.so 只是 libcrispasr.so 的别名，不需要
          find "$OUT_DIR" -name '*.so' -not -path '*/CMakeFiles/*' -not -name 'libwhisper.so' -exec cp -v {} "$GITHUB_WORKSPACE/crispasr-so/" \;

          # 自检：libggml-cpu.so 里应该有 sdot（点积）和 smmla（int8 矩阵乘）指令。数量是 0 说明编译参数没生效，要回来看日志。
          # 反汇编时要告诉 objdump 这些扩展指令，不然它可能把它们当成未知指令。
          OBJDUMP="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
          DIS=$("$OBJDUMP" -d --mattr=+dotprod,+i8mm,+fp16,+bf16 "$GITHUB_WORKSPACE/crispasr-so/libggml-cpu.so")
          SDOT=$(echo "$DIS" | grep -c "sdot" || true)
          SMMLA=$(echo "$DIS" | grep -c "smmla" || true)
          echo "libggml-cpu.so 里的 sdot 指令数：$SDOT，smmla 指令数：$SMMLA"
          [ "${SDOT:-0}" -gt 0 ] || echo "::warning::libggml-cpu.so 里没有 sdot 指令，dotprod 加速没有生效"
          [ "${SMMLA:-0}" -gt 0 ] || echo "::warning::libggml-cpu.so 里没有 smmla 指令，i8mm 加速没有生效"
          "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded "$GITHUB_WORKSPACE"/crispasr-so/*.so
          ls -la "$GITHUB_WORKSPACE/crispasr-so"

      - name: Install CrispASR native libs into app
        run: |
          set -e
          export ANDROID_NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          LLVM="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64"
          DEST=app/src/main/jniLibs/arm64-v8a
          mkdir -p "$DEST"
          cp -v crispasr-so/*.so "$DEST/"
          # 打印这些库还依赖哪些库（方便排查"找不到 libxxx.so"）
          for f in crispasr-so/*.so; do echo "== $f"; "$LLVM/bin/llvm-readelf" -d "$f" | grep NEEDED || true; done
          NEEDED=$("$LLVM/bin/llvm-readelf" -d crispasr-so/*.so | grep NEEDED | sed 's/.*\[\(.*\)\]/\1/' | sort -u)
          # CrispASR 用了 OpenMP，运行时库 libomp.so 在 NDK 里，必须一起打进 APK，否则加载时报 libomp.so not found
          if echo "$NEEDED" | grep -qx "libomp.so"; then
            OMP=$(find "$LLVM/lib" -path '*linux/aarch64/libomp.so' | head -1)
            test -n "$OMP" || { echo "::error::NDK 里找不到 aarch64 的 libomp.so"; exit 1; }
            cp -v "$OMP" "$DEST/"
          fi
          # 如果依赖共享的 C++ 运行库，也一起带上
          if echo "$NEEDED" | grep -qx "libc++_shared.so"; then
            CXX="$LLVM/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
            test -f "$CXX" || { echo "::error::NDK 里找不到 libc++_shared.so"; exit 1; }
            cp -v "$CXX" "$DEST/"
          fi
          ls -la "$DEST"

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Release 包：开启 R8 代码压缩 + 资源压缩、关闭调试开销，日常使用明显更流畅。
      # 放在 Debug 之后并允许失败，这样即使 release 出问题也不影响上面的 Debug 包。
      - name: Build Release APK
        id: release
        continue-on-error: true
        run: ./gradlew assembleRelease

      - name: Upload Release APK
        if: steps.release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk

      # R8 混淆映射表：release 包闪退的堆栈靠它还原成真实类名，请保留
      - name: Upload R8 mapping
        if: steps.release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
