name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Install patchelf
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 使用仓库根目录里固定的 release.keystore：每次构建签名一致，才能直接覆盖安装升级（不用卸载、不丢数据）
      - name: Check signing keystore
        run: test -f release.keystore || (echo "仓库根目录缺少 release.keystore，请先上传" && exit 1)

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Release 包：开启 R8 代码压缩 + 资源压缩、关闭调试开销，日常使用明显更流畅。
      # 放在 Debug 之后并允许失败，这样即使 release 出问题也不影响上面的 Debug 包。
      - name: Build Release APK
        id: release
        continue-on-error: true
        run: ./gradlew assembleRelease

      - name: Upload Release APK
        if: steps.release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk

      # R8 混淆映射表：release 包闪退的堆栈靠它还原成真实类名，请保留
      - name: Upload R8 mapping
        if: steps.release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
