name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Install patchelf
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 使用仓库根目录里固定的 release.keystore：每次构建签名一致，才能直接覆盖安装升级（不用卸载、不丢数据）
      - name: Check signing keystore
        run: test -f release.keystore || (echo "仓库根目录缺少 release.keystore，请先上传" && exit 1)

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Release 包：开启 R8 代码压缩 + 资源压缩、关闭调试开销，日常使用明显更流畅。
      # 放在 Debug 之后并允许失败，这样即使 release 出问题也不影响上面的 Debug 包。
      - name: Build Release APK
        id: release
        continue-on-error: true
        run: ./gradlew assembleRelease

      - name: Upload Release APK
        if: steps.release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk

      # 只读诊断：把 llama 库的方法签名打印出来，用来确认"大模型线程数"能不能设置。不影响 App。
      - name: Inspect llama library API (diagnostic)
        continue-on-error: true
        run: |
          AAR=$(find ~/.gradle -name 'llamacpp-kotlin*.aar' | head -1)
          echo "AAR=$AAR"
          mkdir -p /tmp/llama && cd /tmp/llama
          unzip -q -o "$AAR" && unzip -q -o classes.jar -d cls
          : > /tmp/llama-api.txt
          for c in $(cd cls && find . -name '*.class' | sed 's#^\./##; s#\.class$##; s#/#.#g' | grep -v '\$' | sort); do
            echo "=== $c" >> /tmp/llama-api.txt
            javap -p -cp cls "$c" >> /tmp/llama-api.txt
          done
          echo "---- thread related ----"
          grep -n -i "thread" /tmp/llama-api.txt || echo "(no thread-related member found)"
          echo "---- LlamaHelper ----"
          awk '/^=== .*LlamaHelper/{f=1} f{print} /^}/{if(f) exit}' /tmp/llama-api.txt

      - name: Upload llama API listing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llama-api
          path: /tmp/llama-api.txt
          if-no-files-found: ignore

      # R8 混淆映射表：release 包闪退的堆栈靠它还原成真实类名，请保留
      - name: Upload R8 mapping
        if: steps.release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
